services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civicfix
      POSTGRES_PASSWORD: civicfix
      POSTGRES_DB: civicfix
    ports:
      - "5433:5432"
    volumes:
      - civicfix-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicfix -d civicfix"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  civicfix-postgres:
